<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rent · Power Rentals</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<script src="js/gate.js"></script>
<script>
/* The old four-step booking page is retired: the product page (the buy box) and checkout replace it.
   This page only forwards old links:
     book.html?model=X  ->  product.html?model=X (start and len kept; old len ids become days)
     book.html?cat=Y    ->  equipment.html#Y
     anything else      ->  equipment.html
   A ?key= passcode is passed along so the preview gate still opens on the next page. */
(function () {
  'use strict';
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  var CATS = ['gen', 'heat', 'cool', 'light', 'dist', 'lift'];
  var LEN = { day: 1, week: 7, month: 28, long: 56 };
  var model = q.get('model'), cat = q.get('cat'), dest = 'equipment.html', hash = '';
  if (model && /^[a-z0-9]+$/i.test(model)) {
    dest = 'product.html';
    out.set('model', model);
    if (/^\d{4}-\d{2}-\d{2}$/.test(q.get('start') || '')) out.set('start', q.get('start'));
    var len = q.get('len');
    if (len && (LEN[len] || /^\d{1,3}$/.test(len))) out.set('len', String(LEN[len] || len));
  } else if (cat && CATS.indexOf(cat) !== -1) {
    hash = '#' + cat;
  }
  if (q.get('key')) out.set('key', q.get('key'));
  var s = out.toString();
  location.replace(dest + (s ? '?' + s : '') + hash);
})();
</script>
</head>
<body>
<p style="font-family:Inter,Arial,sans-serif;padding:24px">Booking has moved. <a href="equipment.html">See the equipment</a>.</p>
</body>
</html>
