# Publishes mosesagentic.com on GitHub Pages every time this repo changes (same setup as the Kirby Gate and Mainspring sites).
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The article and news publisher commits with the workflow token, and GitHub does not
  # start a push-triggered run for those commits, so deploy again when it finishes.
  workflow_run:
    workflows: ["Publish approved articles and news"]
    types: [completed]
  # The AI Newswire (public/newswire/) is rebuilt from its feeds about every 30 minutes.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # On the schedule (or a manual run) every feed is read again. On any other deploy the pages are
      # re-made from the items already live, so a normal push is not slowed down. If this step fails,
      # the copy of public/newswire/ in the repo is published and the rest of the site is unaffected.
      - name: Build the AI Newswire
        continue-on-error: true
        timeout-minutes: 10
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            python3 scripts/newswire.py build
          else
            python3 scripts/newswire.py reuse
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
