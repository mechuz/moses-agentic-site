<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Copy proposal link · Moses Agentic</title>
<style>
:root{--bg:#0B2545;--card:#fff;--ink:#0B2545;--mute:#4A6384;--line:#D5E2F0;--lime:#C6F432;--ok:#137A3E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
.card{max-width:560px;margin:0 auto;background:var(--card);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0}
.link{font-size:15px;word-break:break-all;background:#F5F8FC;border:1px solid var(--line);border-radius:10px;padding:12px;user-select:all}
button,a.btn{display:block;width:100%;text-align:center;font:inherit;font-weight:800;font-size:17px;padding:15px;border-radius:999px;border:2px solid var(--ink);cursor:pointer;text-decoration:none}
button{background:var(--lime);color:var(--ink);border-color:var(--lime)}
button:disabled{opacity:.5}
a.btn{background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row a.btn{font-size:15px;padding:12px 6px}
.msg{min-height:1.4em;color:var(--ok);font-weight:700;text-align:center}
.small{font-size:13px;color:var(--mute);margin:0}
</style>
</head>
<body>
<div class="card">
  <h1>Proposal link</h1>
  <div class="link" id="link">No link found.</div>
  <button id="copy" type="button">Copy link</button>
  <div class="msg" id="msg" role="status"></div>
  <div class="row">
    <a class="btn" id="sms" href="#">Text</a>
    <a class="btn" id="wa" href="#">WhatsApp</a>
    <a class="btn" id="mail" href="#">Email</a>
  </div>
  <p class="small">The link stays in this page only; it is never sent to our server.</p>
</div>
<script>
(function(){
  var url='';try{url=decodeURIComponent(location.hash.slice(1)||'');}catch(e){}
  var el=document.getElementById('link'), msg=document.getElementById('msg');
  /* only Moses Agentic links, so this page cannot be used to dress up someone else's link */
  if(!/^https:\/\/(www\.)?mosesagentic\.com\//.test(url)){document.getElementById('copy').disabled=true;return;}
  el.textContent=url;
  var text='Hi, here is your proposal from Moses Agentic: '+url;
  document.getElementById('sms').href='sms:?&body='+encodeURIComponent(text);
  document.getElementById('wa').href='https://wa.me/?text='+encodeURIComponent(text);
  document.getElementById('mail').href='mailto:?subject='+encodeURIComponent('Your proposal from Moses Agentic')+'&body='+encodeURIComponent(text);
  function fallback(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');msg.textContent='Copied. Paste it anywhere.';}catch(e){msg.textContent='Selected. Press copy on your keyboard or phone.';}}
  document.getElementById('copy').addEventListener('click',function(){
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){msg.textContent='Copied. Paste it anywhere.';},fallback);}else{fallback();}
  });
})();
</script>
</body>
</html>
