<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="Moses Agentic">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{image_abs}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{image_abs}}">
<link rel="alternate" type="application/rss+xml" title="Moses Agentic: Insights" href="/feed.xml">
<link rel="alternate" type="application/rss+xml" title="Moses Agentic: Technology news for business" href="/news/feed.xml">
<script type="application/ld+json">{{schema}}</script>
{{shell_head}}
<style>
/* The article's own parts. Header, hero, bottom menu, footer, type and colors: /vendor/site-shell.css (the front page's look). */
.ms-hero .ms-in { max-width:900px; }
.ms-hero .lead { font:italic 400 clamp(1.4rem, 2.3vw, 1.8rem)/1.3 var(--ms-fs); letter-spacing:-.01em; color:var(--ms-ink); margin:1.2rem auto 0; max-width:40ch; }
[dir="rtl"] .ms-hero .lead { font-style:normal; font-family:var(--ms-f); font-weight:500; }
.meta { display:flex; flex-wrap:wrap; justify-content:center; gap:.5rem 1.2rem; margin:1.4rem 0 0; font-size:1rem; color:var(--ms-mut); align-items:center; }
.meta .tag { background:#FFFFFF; border:1px solid var(--ms-line); border-radius:999px; padding:.2rem .8rem; color:var(--ms-ink); font-weight:500; }
main .ms-wrap { max-width:800px; padding-top:.6rem; padding-bottom:1rem; }
article { font-size:1.08rem; line-height:1.7; }
article img.hero { width:100%; height:auto; border-radius:20px; margin:0 0 1.8rem; display:block; }
article h2 { font:600 1.75rem/1.2 var(--ms-f); letter-spacing:-.03em; margin:2.2em 0 .6em; color:var(--ms-ink); }
article h3 { font:600 1.25rem/1.3 var(--ms-f); letter-spacing:-.01em; margin:1.8em 0 .5em; color:var(--ms-ink); }
article p, article li { max-width:68ch; }
article ul, article ol { padding-inline-start:1.3em; }
article li { margin:.35em 0; }
article blockquote { margin:1.6em 0; padding:.3em 0 .3em 1.2em; border-inline-start:5px solid var(--ms-lime); color:var(--ms-ink); font:italic 400 1.35rem/1.4 var(--ms-fs); }
article table { border-collapse:collapse; width:100%; font-size:1rem; margin:1.4em 0; }
article th, article td { text-align:start; padding:.6em .7em; border-bottom:1px solid var(--ms-line); vertical-align:top; }
article th { background:var(--ms-soft); font-weight:600; }
article ul.checklist { list-style:none; padding:0; }
article ul.checklist li { padding-inline-start:1.9em; position:relative; }
article ul.checklist li::before { content:"✓"; position:absolute; inset-inline-start:0; color:var(--ms-blue); font-weight:700; }
.disclaimer { font-size:1rem; color:var(--ms-mut); border-top:1px solid var(--ms-line); padding-top:1rem; margin-top:2.5rem; }
.cta { background:var(--ms-soft); border:1px solid var(--ms-line); border-radius:24px; padding:2.2rem 1.8rem; margin:2.8rem 0 0; display:grid; justify-items:center; gap:.8rem; text-align:center; }
.cta h2 { margin:0; color:var(--ms-ink); font:600 1.8rem/1.15 var(--ms-f); letter-spacing:-.03em; }
.cta p { margin:0; color:var(--ms-mut); max-width:56ch; }
.cta .ms-btns { margin-top:.6rem; }
.related { margin-top:2.6rem; }
.related h2 { font:600 1.3rem/1.2 var(--ms-f); letter-spacing:-.02em; margin:0 0 .8rem; color:var(--ms-ink); }
.related ul { list-style:none; padding:0; margin:0; display:grid; gap:.6rem; }
.related li a { display:block; padding:.9rem 1.1rem; border:1px solid var(--ms-line); border-radius:14px; text-decoration:none; color:var(--ms-ink); font-weight:500; }
.related li a:hover { border-color:var(--ms-blue); color:var(--ms-blue); }
.source { margin-top:1.4rem; font-size:1rem; }
@media (max-width:640px) { .cta { border-radius:18px; padding:1.6rem 1.2rem; } }
</style>
</head>
<body>
{{shell_top}}

<section class="ms-hero">{{shell_fx}}<div class="ms-in">
  <p class="ms-k">{{kicker}}</p>
  <h1 class="ms-h1">{{headline}}</h1>
  {{lead_html}}
  <div class="meta">{{meta_html}}</div>
</div></section>

<main><div class="ms-wrap">
<article>
{{hero_img}}
{{body}}
{{source_html}}
{{disclaimer_html}}
</article>

<aside class="cta" aria-label="Talk to us">
  <h2>{{cta_title}}</h2>
  <p>{{cta_text}}</p>
  <div class="ms-btns">
    <a class="ms-btn" href="/#consult">Book a free consultation <span aria-hidden="true">→</span></a>
    <a class="ms-btn ghost" href="/case-studies/">See the case studies</a>
  </div>
</aside>

{{related_html}}
</div></main>

{{shell_footer}}
{{shell_dock}}
</body>
</html>
