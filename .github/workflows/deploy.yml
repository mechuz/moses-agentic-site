# Publishes mosesagentic.com on GitHub Pages every time this repo changes (same setup as the Kirby Gate and Mainspring sites).
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The article and news publisher commits with the workflow token, and GitHub does not
  # start a push-triggered run for those commits, so deploy again when it finishes.
  workflow_run:
    workflows: ["Publish approved articles and news"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
