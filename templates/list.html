<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Moses Agentic">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="https://mosesagentic.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/rss+xml" title="Moses Agentic: Insights" href="/feed.xml">
<link rel="alternate" type="application/rss+xml" title="Moses Agentic: Technology news for business" href="/news/feed.xml">
<script type="application/ld+json">{{schema}}</script>
{{shell_head}}
<style>
/* The page's own parts. Header, hero, bottom menu, footer, type and colors: /vendor/site-shell.css (the front page's look). */
.chips { display:flex; flex-wrap:wrap; justify-content:center; gap:.5rem; margin:1.6rem 0 0; }
.chips a { background:#FFFFFF; border:1px solid var(--ms-line); border-radius:999px; padding:.45rem 1rem; font:500 1rem/1.2 var(--ms-f); color:var(--ms-ink); text-decoration:none; }
.chips a:hover { border-color:var(--ms-blue); color:var(--ms-blue); }
.chips a[aria-current="true"] { background:var(--ms-lime); border-color:var(--ms-lime); color:var(--ms-ink); font-weight:600; }
main .ms-wrap { padding-top:.6rem; padding-bottom:1rem; }
.month { font:600 1rem/1.3 var(--ms-f); color:var(--ms-ink); margin:2.4rem 0 1rem; text-align:center; }
.grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }
.card { border:1px solid var(--ms-line); border-radius:20px; padding:1.4rem 1.5rem; display:grid; gap:.6rem; background:#FFFFFF; align-content:start; transition:border-color .15s, transform .15s, box-shadow .15s; }
.card:hover { border-color:var(--ms-blue); transform:translateY(-2px); box-shadow:0 14px 34px -22px rgba(11,37,69,.45); }
.card .cat { font:600 .95rem/1.2 var(--ms-f); color:var(--ms-blue); }
.card h2 { font:600 1.35rem/1.2 var(--ms-f); letter-spacing:-.025em; margin:0; color:var(--ms-ink); }
.card h2 a { color:inherit; text-decoration:none; }
.card h2 a:hover { color:var(--ms-blue); }
.card p { margin:0; color:var(--ms-ink); font-size:1rem; line-height:1.55; }
.card .why { color:var(--ms-mut); }
.card .foot { display:flex; flex-wrap:wrap; justify-content:space-between; gap:.4rem; font-size:1rem; color:var(--ms-mut); margin-top:.3rem; }
.card .foot a { font-weight:600; text-decoration:none; }
.card .foot a:hover { text-decoration:underline; }
.empty { color:var(--ms-mut); padding:2rem 0; font:italic 400 1.5rem/1.4 var(--ms-fs); text-align:center; }
.share { background:var(--ms-soft); border:1px solid var(--ms-line); border-radius:20px; padding:1.4rem 1.5rem; margin-top:2.6rem; color:var(--ms-ink); font-size:1.05rem; text-align:center; }
.share a { font-weight:600; }
</style>
</head>
<body>
{{shell_top}}

<section class="ms-hero">{{shell_fx}}<div class="ms-in">
  <p class="ms-k">{{kicker}}</p>
  <h1 class="ms-h1">{{headline}}</h1>
  <p class="ms-one">{{lead}}</p>
  {{chips_html}}
</div></section>

<main><div class="ms-wrap">
{{items_html}}
{{share_html}}
</div></main>

{{shell_footer}}
{{shell_dock}}
</body>
</html>
